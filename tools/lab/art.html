<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
html,body{overflow:hidden;touch-action:auto;background:#333}
#lab{position:relative;width:1920px;height:1080px;transform-origin:0 0;background:#f4ebd4;overflow:hidden}
#bar{position:fixed;right:6px;top:6px;z-index:9;background:#000a;color:#fff;padding:4px 8px;font:12px monospace}
</style></head><body>
<div id="bar"></div>
<div id="lab"></div>
<script src="../../js/core.js"></script>
<script src="../../js/ink.js"></script>
<script src="../../js/art_bg.js"></script>
<script src="../../js/art_chars.js"></script>
<script src="../../js/art_props.js"></script>
<script src="../../js/art_placeholder.js"></script>
<script>
// usage: art.html?bg=path&ch=tam_top@x,y,w&prop=axe@x,y,w  (multiple ch/prop allowed, comma-separated by ;)
TC.ink.installDefs();
const q = new URLSearchParams(location.search);
const lab = document.getElementById('lab');
const s = q.get('scale') ? +q.get('scale') : Math.min(innerWidth / 1920, innerHeight / 1080);
lab.style.transform = `scale(${s})`;
const t0 = performance.now();
if (q.get('bg')) lab.insertAdjacentHTML('beforeend', `<div style="position:absolute;inset:0">${TC.art.bg[q.get('bg')]()}</div>`);
for (const kind of ['ch', 'prop']) {
  (q.get(kind) || '').split(';').filter(Boolean).forEach((spec) => {
    const [idv, pos] = spec.split('@');
    const [id, variant] = idv.split(':');
    const [x, y, w] = (pos || '0,0,600').split(',').map(Number);
    const src = (kind === 'ch' ? TC.art.ch : TC.art.prop)[id](variant);
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px`;
    d.innerHTML = src;
    const svg = d.querySelector('svg'); svg.style.width = '100%'; svg.style.height = 'auto';
    lab.appendChild(d);
  });
}
document.getElementById('bar').textContent = `render ${(performance.now() - t0).toFixed(0)}ms  bytes ${lab.innerHTML.length}`;
</script>
</body></html>
