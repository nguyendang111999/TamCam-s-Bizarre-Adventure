<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a1c">
<meta name="description" content="Tấm Cám's Bizarre Adventure — a goofy Slay-the-Princess-style retelling of the Vietnamese fairy tale Tấm Cám, drawn in a JoJo Stardust Crusaders style.">
<title>Tấm Cám's Bizarre Adventure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23120a1c'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='%23f7c325' stroke='%23000' stroke-width='3' paint-order='stroke'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="world">
      <div id="bg" class="layer"></div>
      <div id="actors" class="layer"></div>
    </div>
    <canvas id="fx" class="layer"></canvas>
    <div id="panels" class="layer"></div>
    <div id="sfx" class="layer"></div>
    <div id="fade" class="layer"></div>
    <div id="ui" class="layer">
      <div id="voices"></div>
      <div id="hud">
        <button class="hud-btn" data-act="auto" title="Auto (A)">AUTO</button>
        <button class="hud-btn" data-act="skip" title="Skip (S / hold Ctrl)">SKIP</button>
        <button class="hud-btn" data-act="log" title="Log (L)">LOG</button>
        <button class="hud-btn" data-act="menu" title="Menu (Esc)">☰</button>
      </div>
      <div id="choices"></div>
      <div id="box" class="hidden">
        <div id="box-frame"></div>
        <div id="nametag"><span></span></div>
        <div id="text"></div>
        <div id="next">▼</div>
      </div>
      <div id="prompt" class="hidden"></div>
    </div>
    <div id="overlay" class="layer"></div>
    <div id="menus" class="layer"></div>
    <div id="grain" class="layer"></div>
  </div>
</div>
<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">TẤM CÁM'S</div>
    <div class="boot-sub">BIZARRE ADVENTURE</div>
    <button id="boot-btn" disabled>LOADING…</button>
    <div class="boot-note">🔊 Sound on · best in fullscreen · <span class="kbd">Space</span>/<span class="kbd">Click</span>/<span class="kbd">Tap</span> to advance</div>
  </div>
</div>
<div id="rotate"><div>↻</div><p>Rotate your phone<br><small>Xoay ngang điện thoại</small></p></div>
<noscript><p style="color:#fff;font:20px sans-serif;padding:40px">This game needs JavaScript.</p></noscript>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/ink.js"></script>
<script src="js/art_bg.js"></script>
<script src="js/art_chars.js"></script>
<script src="js/art_props.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/minigames.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
